<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>上架商品</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-btn" onclick="toggleSidebar()">&#9776;</div>
    <div class="sidebar" id="sidebar">
        <a href="home.html">首頁</a>
        <a href="member.php">會員資料</a>
        <a href="product.html">上架商品</a>
        <a href="productmanagement.php">商品列表</a>
    </div>

    <div class="container">
        <h2>上架商品</h2>
        <form action="product.php" method="POST" enctype="multipart/form-data" class="profile-form">
            
                <div class="image-preview"></div>

            <div class="left-column">
                <div class="form-group">
                    <input id="imageInput" type="file" name="images[]" accept="image/*" multiple required>
                    <label>上傳圖片（可多選）：</label>
                </div>
                <div class="form-group">
                    <input type="text" name="product" required placeholder=" ">
                    <label>產品名稱</label>
                </div>
                <div class="form-group">
                    <textarea name="content" rows="5" placeholder="" required></textarea>
                    <label>產品內容</label>
                </div>
            </div>

            <div class="right-column">
                <div class="form-group">
                    <select name="type" required>
                        <option value="">產品類型</option>
                        <option value="太陽能">太陽能</option>
                        <option value="風能">風能</option>
                        <option value="水力">水力</option>
                        <option value="地熱">地熱</option>
                        <option value="儲能">儲能</option>
                    </select>
                    <label>產品類型</label>
                </div>
                <div class="form-group">
                    <input type="number" step="0.00001" name="emission_factor" required placeholder=" ">
                    <label>碳排因子</label>
                </div>
                <div class="form-group">
                    <input type="number" step="1" name="price" required placeholder=" ">
                    <label>單價（元）</label>
                </div>
                <div class="form-group">
                    <input type="number" name="amount" required placeholder=" ">
                    <label>數量</label>
                </div>
            </div>

            <div class="submit-button-container">
                <button type="submit">提交商品</button>
            </div>
        </form>
    </div>
<script src="product.js"></script>
</body>
</html>
