<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊頁面</title>
    <link rel="stylesheet" href="style.css">
    <script src="next.js"></script>
</head>
<body>
    <div class="container">
        <h2>註冊</h2>
        <form id="register-form" action="register.php" method="POST">
            <!-- 步驟1：使用者名稱和密碼 -->
            <div class="step" id="step-1">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder=" " required>
                    <label for="username">使用者名稱</label>
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder=" " required>
                    <label for="password">密碼</label>
                </div>
                <button type="button" class="next-btn" onclick="nextStep(2)">下一步</button>
            </div>

            <!-- 步驟2：電子郵件和生日 -->
            <div class="step" id="step-2" style="display: none;">
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder=" " required>
                    <label for="email">電子郵件</label>
                </div>
                <div class="form-group">
                    <input type="date" id="birthday" name="birthday" placeholder=" " required>
                    <label for="birthday"></label>
                </div>
                <button type="button" class="next-btn" onclick="nextStep(3)">下一步</button>
            </div>

            <!-- 步驟3：縣市、區域和地址 -->
            <div class="step" id="step-3" style="display: none;">
                <div class="form-group">
                    <input type="text" id="city" name="city" placeholder=" " required>
                    <label for="city">縣市</label>
                </div>
                <div class="form-group">
                    <input type="text" id="district" name="district" placeholder=" " required>
                    <label for="district">區域</label>
                </div>
                <div class="form-group">
                    <input type="text" id="street" name="street" placeholder=" " required>
                    <label for="street">街道</label>
                </div>
                <div class="form-group">
                    <input type="text" id="house_number" name="house_number" placeholder=" " required>
                    <label for="house_number">門牌號</label>
                </div>
                <!-- 直接使用 submit 按鈕提交表單 -->
                <button type="submit" class="next-btn">註冊</button>
            </div>
        </form>
        <div class="form-footer">
            <a href="login.html" class="link">已註冊帳號?登入</a>
            <a href="about.html" class="link">關於我們</a>
        </div>
    </div>
</body>
</html>
